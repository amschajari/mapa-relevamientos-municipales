body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}

header{background:var(--panel);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:16px;flex-shrink:0}
header h1{font-size:15px;font-weight:700;color:var(--accent)}
.stats{display:flex;gap:16px;margin-left:auto}
.stat{display:flex;align-items:center;gap:6px;font-size:12px}
.stat-dot{width:10px;height:10px;border-radius:50%}
.stat-dot.cons{background:var(--cons)}.stat-dot.desc{background:var(--desc)}.stat-dot.pend{background:var(--pend)}
.toolbar{display:flex;gap:8px;padding:8px 16px;background:var(--panel2);border-bottom:1px solid var(--border);flex-shrink:0}
.tool-btn{padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:12px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px}
.tool-btn:hover{background:var(--border)}
.tool-btn.active{background:var(--accent);color:#000;border-color:var(--accent)}
.tool-btn.cons{background:var(--cons);color:#fff;border-color:var(--cons)}
.tool-btn.cons:hover{background:#15803d}
.tool-btn.desc{background:var(--desc);color:#fff;border-color:var(--desc)}
.tool-btn.desc:hover{background:#b91c1c}
.tool-sep{width:1px;background:var(--border);margin:0 4px}

.main{display:flex;flex:1;overflow:hidden}
#map{flex:1}

.sidebar{width:340px;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.sidebar-scroll{flex:1;overflow-y:auto;min-height:0}
.sidebar-scroll::-webkit-scrollbar{width:4px}
.sidebar-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.sidebar-footers{flex-shrink:0}
.sidebar-header{padding:12px 14px;border-bottom:1px solid var(--border)}
.sidebar-header h2{font-size:11px;font-weight:600;color:var(--text-m);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.search-box{position:relative}
.search-box input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:7px 10px 7px 30px;color:var(--text);font-size:13px;outline:none}
.search-box input:focus{border-color:var(--accent)}
.search-icon{position:absolute;left:8px;top:8px;font-size:11px;pointer-events:none}

.filter-tabs{display:flex;gap:4px;padding:8px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.filter-tab{flex:1;padding:5px 4px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--text-m);font-size:11px;cursor:pointer;text-align:center;transition:all .15s}
.filter-tab.active{color:#fff;border-color:transparent}
.filter-tab[data-cat="all"].active{background:#475569}
.filter-tab[data-cat="conservado"].active{background:var(--cons)}
.filter-tab[data-cat="descartado"].active{background:var(--desc)}
.filter-tab[data-cat="pendiente"].active{background:var(--pend);color:#000}
.filter-tab[data-cat="qwen"].active{background:#0ea5e9;color:#fff}

.list-container{padding:6px 8px}
.list-container::-webkit-scrollbar{width:4px}
.list-container::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.segment-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent;margin-bottom:2px;transition:all .12s;font-size:11px}
.segment-item:hover{background:rgba(255,255,255,.05)}
.segment-item.selected{background:rgba(56,189,248,.15);border-color:var(--accent)}
.segment-item.conservado{background:var(--cons-bg);border-left:3px solid var(--cons);color:var(--cons-dark)}
.segment-item.descartado{background:var(--desc-bg);border-left:3px solid var(--desc);color:var(--desc-dark)}
.segment-item.pendiente{background:var(--pend-bg);border-left:3px solid var(--pend);color:var(--pend-dark)}
.seg-name{flex:1;line-height:1.3}
.seg-meta{font-size:10px;color:var(--text-m)}
.seg-status{font-size:9px;padding:2px 6px;border-radius:4px;font-weight:600}
.seg-status.conservado{background:var(--cons);color:#fff}
.seg-status.descartado{background:var(--desc);color:#fff}
.seg-status.pendiente{background:var(--pend);color:#000}

.attrs-panel{padding:12px 14px;border-top:1px solid var(--border);background:var(--panel2)}
.attrs-panel h3{font-size:11px;color:var(--text-m);text-transform:uppercase;margin-bottom:10px}
.attr-row{display:flex;gap:8px;margin-bottom:8px}
.attr-row label{flex:0 0 70px;font-size:11px;color:var(--text-m);padding-top:6px}
.attr-row input,.attr-row select{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:6px 8px;color:var(--text);font-size:12px}
.attr-row input:focus,.attr-row select:focus{border-color:var(--accent);outline:none}
.attr-btn{padding:8px 12px;border-radius:6px;border:none;font-size:12px;font-weight:600;cursor:pointer;flex:1;transition:all .15s}
.attr-btn.cons{background:var(--cons);color:#fff}
.attr-btn.desc{background:var(--desc);color:#fff}
.attr-btn:disabled{opacity:.5;cursor:not-allowed}

.footer{padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0}
.btn{flex:1;padding:8px 12px;border-radius:6px;border:none;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--accent);color:#0f172a}
.btn-primary:hover{background:var(--accent-hover)}
.btn-secondary{background:var(--border);color:var(--text)}
.btn-secondary:hover{background:#475569}

.legend{position:absolute;bottom:24px;left:12px;z-index:1000;background:rgba(15,23,42,.92);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:11px}
.legend h4{font-size:10px;color:var(--text-m);text-transform:uppercase;margin-bottom:6px}
.legend-row{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.legend-line{width:20px;height:3px;border-radius:2px}

.toast{position:fixed;bottom:20px;right:20px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:12px;z-index:9999;transform:translateY(80px);opacity:0;transition:all .3s;pointer-events:none}
.toast.show{transform:translateY(0);opacity:1}

.info-box{position:absolute;top:60px;right:360px;z-index:1000;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:11px;max-width:200px;display:none}
.info-box.show{display:block}

.selection-info{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:1000;background:var(--panel);border:1px solid var(--accent);border-radius:20px;padding:6px 16px;font-size:12px;color:var(--accent);font-weight:600;display:none}
.selection-info.show{display:block}
</style>
</head>

      <button class="filter-tab" data-cat="pendiente" onclick="setFilter('pendiente',this)">Pendientes</button>

      <div class="attrs-panel" id="attrs-panel" style="display:none">

        <div class="attr-row">

          <select id="attr-tipo"><option value="">Seleccionar...</option><option value="Hormigon">Hormig\u00f3n</option><option value="Pavimento asfaltico">Pavimento asf\u00e1ltico</option></select>

          <input type="text" id="attr-entre1" placeholder="Calle norte/este">
        </div>
        <div class="attr-row">
          <label>Entre calle 2</label>
          <input type="text" id="attr-entre2" placeholder="Calle sur/oeste">
        </div>
        <div class="attr-row">
          <label>Aprobaci\u00f3n</label>
          <input type="date" id="attr-aprob">
        </div>
        <div class="attr-row">
          <label>Inaugurac.</label>
          <input type="date" id="attr-inaug">
        </div>
        <div class="attr-row">
          <label>Observ.</label>
          <input type="text" id="attr-obs" placeholder="Notas...">
        </div>
        <button class="attr-btn cons" onclick="aplicarAtributos()">Aplicar a seleccionados</button>
      </div>
      <div class="attrs-panel" id="qwen-panel" style="display:none;border-top:2px solid #16a34a">
        <h3 style="color:#22c55e">📋 Normativa Qwen</h3>
        <div id="qwen-content"></div>
      </div>
    </div>
    <div class="sidebar-footers">
      <div class="footer">
        <button class="btn btn-secondary" onclick="exportGeoJSON()">⬇ Exportar Final</button>
        <button class="btn btn-secondary" onclick="guardarProgreso()">💾 Guardar Progreso</button>
        <button class="btn btn-secondary" onclick="aplicarQwen()" style="background:#0ea5e9;color:#fff">📋 Aplicar Qwen</button>
        <button class="btn btn-primary" onclick="guardarEnSupabase()">☁ Subir a Supabase</button>
      </div>
      <div class="footer" style="border-top:none;padding-top:0;">
        <button class="btn btn-secondary" onclick="document.getElementById('import-file').click()">📥 Importar Segmentos</button>
        <input type="file" id="import-file" accept=".geojson" style="display:none">
        <button class="btn btn-secondary" onclick="document.getElementById('import-faltantes-file').click()" style="background:#f59e0b;color:#fff">➕ Importar calles faltantes</button>
        <input type="file" id="import-faltantes-file" accept=".geojson" style="display:none">
        <button class="btn btn-secondary" onclick="cargarArchivoOficial()">📂 Cargar 2422 local</button>
        <button class="btn btn-secondary" onclick="sincronizarDesdeSupabase()">🔄 Sincronizar</button>
        <button class="btn btn-secondary" style="background:#dc2626;color:#fff" onclick="reemplazarTodoEnSupabase()">⚠️ Reemplazar Todo</button>
      </div>
    </div>
  </div>
</div>

<div class="legend">

<div class="toast" id="toast"></div>
<div class="info-box" id="info-box"></div>

};

function matchCalle(detected, qwenValue) {
  if (!detected || !qwenValue) return false;
  const a = detected.toLowerCase().trim();
  const b = qwenValue.toLowerCase().trim();
  if (a === b) return true;
  const normA = (CALLE_ALIAS[a] || '').toLowerCase().trim();
  const normB = (CALLE_ALIAS[b] || '').toLowerCase().trim();
  if (normA && normA === b) return true;
  if (normB && a === normB) return true;
  if (normA && normB && normA === normB) return true;
  return false;
}

function tieneQwen(seg) {
  if (!seg || !seg.name) return false;
  const records = getQwenForCalle(seg.name);
  if (records.length === 0) return false;
  return !!(seg.props.tipo_obra || seg.props.fecha_aprobacion_concejo || seg.props.observaciones);
}

function colorParaSegmento(seg) {
  if (!seg) return COLORS.pendiente;
  if (tieneQwen(seg) && seg.props.estado === 'conservado') return '#0ea5e9';
  return COLORS[seg.props.estado] || COLORS.pendiente;
}
function weightParaSegmento(seg) {
  if (!seg) return WEIGHTS.pendiente;
  if (tieneQwen(seg) && seg.props.estado === 'conservado') return 5;
  return WEIGHTS[seg.props.estado] || WEIGHTS.pendiente;
}
function opacityParaSegmento(seg) {
  if (!seg) return OPACITIES.pendiente;
  return OPACITIES[seg.props.estado] || OPACITIES.pendiente;
}

// ==================== CARGA DE DATOS ====================
let geojson = null;
let segments = [];
let segmentLayers = {};
let selectedIds = new Set();
let currentTool = 'select';
let currentFilter = 'all';
let boxSelection = null;
let isShiftDown = false;
let isCtrlDown = false;

const COLORS = {conservado:'#16a34a',descartado:'#dc2626',pendiente:'#f59e0b'};
const WEIGHTS = {conservado:4,descartado:2,pendiente:3};
const OPACITIES = {conservado:0.9,descartado:0.3,pendiente:0.7};

// Cargar datos: desde Supabase por defecto (892 segmentos, MultiLineString)
// Fallback a archivo local (2422 segmentos, LineString) si no hay datos en Supabase
async function loadGeoJSON(){
 // Cargar desde Supabase por defecto
 await sincronizarDesdeSupabase(true);
 
 // Si no se cargaron datos, intentar desde archivo local
 if (segments.length === 0) {
 console.log('Sin datos en Supabase, cargando desde archivo local...');
 await loadFromLocalFile();
 }
}

// Cargar desde archivo local (principal)
async function loadFromLocalFile(){
 try {
 showToast('Cargando datos locales...');
 const response = await fetch('./calles_segmentadas.geojson');
 if(!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
 const geojsonData = await response.json();
 geojson = geojsonData;
 segments = geojson.features.map((f,i)=>({
 id: f.properties.fid || i+1,
 name: f.properties.name || '',
 props: {...f.properties, estado: f.properties.estado || 'pendiente'},
 geom: f.geometry
 })).filter(s => s.geom && (s.geom.type === 'LineString' || s.geom.type === 'MultiLineString'));
 
 document.getElementById('total-segs').textContent = segments.length;
 console.log(`Cargados ${segments.length} segmentos desde archivo local`);
 showToast(`Cargados ${segments.length} segmentos`);
 buildLayers();
 detectIntersections();
 updateStats();
 } catch(e) {
 console.error('Error cargando archivo local:', e);
 showToast('Error cargando GeoJSON local. Asegurate de tener el archivo calles_segmentadas.geojson');
 }
}

// ==================== MAPA ====================
const map = L.map('map',{center:[-30.755,-57.985],zoom:14,zoomControl:true});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM',maxZoom:19}).addTo(map);

const layerGroup = L.layerGroup().addTo(map);

function buildLayers(){
 layerGroup.clearLayers();
 segmentLayers = {};
 segments.forEach(seg=>{
 // Normalizar geometría
 let coords;
 if (!seg.geom) return;
 
 if (seg.geom.type === 'LineString') {
 coords = seg.geom.coordinates;
 } else if (seg.geom.type === 'MultiLineString') {
 // Para MultiLineString, usar la primera línea o concatenar todas
 coords = seg.geom.coordinates[0] || [];
 } else {
 console.warn('Tipo de geometría no soportado:', seg.geom.type);
 return;
 }
 
 if (!coords || coords.length < 2) return;
 
  const latlngs = coords.map(c=>[c[1],c[0]]);
  const line = L.polyline(latlngs,{
  color: colorParaSegmento(seg),
  weight: weightParaSegmento(seg),
  opacity: opacityParaSegmento(seg)
  });
 line.on('click',e=>handleSegmentClick(seg.id,e));
 line.on('dblclick',e=>handleSegmentDoubleClick(seg.id,e));
 line.segId = seg.id;
 layerGroup.addLayer(line);
 segmentLayers[seg.id] = line;
 });
 renderList();
}

function updateLayerColor(id){
  const seg = segments.find(s=>s.id===id);
  if(!seg||!segmentLayers[id])return;
  segmentLayers[id].setStyle({
    color: colorParaSegmento(seg),
    weight: weightParaSegmento(seg),
    opacity: opacityParaSegmento(seg)
  });
}

function updateStats(){
  let cons=0,desc=0,pend=0,qwen=0;
  segments.forEach(s=>{
    if(s.props.estado==='conservado')cons++;
    else if(s.props.estado==='descartado')desc++;
    else pend++;
    if(tieneQwen(s)) qwen++;
  });
  document.getElementById('cnt-cons').textContent = cons;
  document.getElementById('cnt-desc').textContent = desc;
  document.getElementById('cnt-pend').textContent = pend;
  document.getElementById('cnt-qwen').textContent = qwen;
}

// ==================== SELECCIÓN ====================
function handleSegmentClick(id, e){
  e.originalEvent.stopPropagation();
  
  if(currentTool==='corte'){
    handleCorte(id,e.latlng);
    return;
  }
  
  if(currentTool==='box') return;
  
  // Selección
  if(isShiftDown && selectedIds.size>0){
    const allIds = segments.map(s=>s.id);
    const lastSelected = Array.from(selectedIds).pop();
    const lastIdx = allIds.indexOf(lastSelected);
    const currIdx = allIds.indexOf(id);
    const [start,end] = lastIdx<currIdx?[lastIdx,currIdx]:[currIdx,lastIdx];
    for(let i=start;i<=end;i++) selectedIds.add(allIds[i]);
  }else if(isCtrlDown){
    if(selectedIds.has(id)) selectedIds.delete(id);
    else selectedIds.add(id);
  }else{
    selectedIds.clear();
    selectedIds.add(id);
  }
  
  updateSelectionUI();
  
  // Mostrar popup con info completa
  const seg = segments.find(s => s.id === id);
  if (!seg) return;
  
  const qwenRecords = getQwenForCalle(seg.name);
  const entre1 = seg.props.entre_calle_1 || '';
  const entre2 = seg.props.entre_calle_2 || '';
  const tramo = (entre1 || entre2) ? `entre ${entre1} y ${entre2}` : 'sin entrecalles';
  
  let qwenHtml = '';
  if (qwenRecords.length > 0) {
    qwenHtml = qwenRecords.map(q => `
      <div style="border-left:2px solid #22c55e;padding-left:8px;margin-top:4px;font-size:11px;color:#94a3b8">
        <div style="font-weight:600;color:#60a5fa">${q.norma || 'Sin norma'}</div>
        <div>${q.desde} → ${q.hasta}</div>
        <div>${q.tipo_obra} · ${q.fecha_aprobacion}${q.fecha_inauguracion ? ' · Inaug: '+q.fecha_inauguracion : ''}</div>
        ${q.url ? `<a href="${q.url}" target="_blank" style="color:#38bdf8;font-size:10px">🔗 Ver en digesto</a>` : ''}
      </div>
    `).join('');
  } else {
    qwenHtml = '<div style="color:#64748b;font-style:italic;margin-top:4px;font-size:11px">Sin datos normativos</div>';
  }

  const popupContent = document.createElement('div');
  popupContent.style.minWidth = '240px';
  popupContent.innerHTML = `
    <div style="font-size:14px;font-weight:700;color:#f8fafc">${seg.name}</div>
    <div style="font-size:11px;color:#94a3b8;margin:4px 0">FID ${seg.id} · ${(seg.props.longitud_m||calcularLongitud(seg.geom))}m · ${tramo}</div>
    ${seg.props.tipo_obra ? `<div style="font-size:11px;color:#22c55e;margin-bottom:4px">${seg.props.tipo_obra}</div>` : ''}
    ${seg.props.estado !== 'pendiente' ? `<div style="font-size:10px;color:#64748b;margin-bottom:4px">Estado: ${seg.props.estado}</div>` : ''}
    ${qwenHtml}
    <div style="margin-top:8px;display:flex;gap:6px">
      <button onclick="marcarUnoSolo(${id},'conservado')" style="flex:1;padding:4px 8px;border-radius:4px;border:none;background:#16a34a;color:#fff;font-size:11px;cursor:pointer">✓ Conservar</button>
      <button onclick="marcarUnoSolo(${id},'descartado')" style="flex:1;padding:4px 8px;border-radius:4px;border:none;background:#dc2626;color:#fff;font-size:11px;cursor:pointer">✗ Descartar</button>
    </div>
  `;
  
  const layer = segmentLayers[id];
  if (layer) {
    layer.bindPopup(popupContent).openPopup();
  }
}

function marcarUnoSolo(id, estado) {
  const seg = segments.find(s => s.id === id);
  if (!seg) return;
  seg.props.estado = estado;
  updateLayerColor(id);
  updateStats();
  renderList();
  // Cerrar popup
  const layer = segmentLayers[id];
  if (layer) layer.closePopup();
  showToast(`Segmento marcado como: ${estado}`);
}

function handleSegmentDoubleClick(id,e){
  const seg = segments.find(s=>s.id===id);
  if(!seg)return;
  // Toggle estado
  const estados = ['pendiente','conservado','descartado'];
  const currIdx = estados.indexOf(seg.props.estado);
  seg.props.estado = estados[(currIdx+1)%3];
  updateLayerColor(id);
  updateStats();
  renderList();
  showToast(`Segmento marcado como: ${seg.props.estado}`);
}

function updateSelectionUI(){
  document.querySelectorAll('.segment-item').forEach(el=>{
    const id = parseInt(el.dataset.id);
    el.classList.toggle('selected',selectedIds.has(id));
  });
  
  const info = document.getElementById('selection-info');
  if(selectedIds.size>0){
    info.textContent = `${selectedIds.size} seleccionado(s)`;
    info.classList.add('show');
    document.getElementById('attrs-panel').style.display = 'block';
    // Mostrar panel Qwen si es una selección individual
    mostrarQwenParaSeleccion();
  }else{
    info.classList.remove('show');
    document.getElementById('attrs-panel').style.display = 'none';
    document.getElementById('qwen-panel').style.display = 'none';
  }
  
  // Resaltar en mapa
  Object.entries(segmentLayers).forEach(([id,layer])=>{
    if(selectedIds.has(parseInt(id))){
      layer.bringToFront();
      layer.setStyle({color:'#38bdf8', weight:6, opacity:1, dashArray:'5,5'});
    }else{
      const seg = segments.find(s=>s.id===parseInt(id));
      if (seg) layer.setStyle({color: colorParaSegmento(seg), weight: weightParaSegmento(seg), opacity: opacityParaSegmento(seg), dashArray:null});
    }
  });
}

function mostrarQwenParaSeleccion() {
  const panel = document.getElementById('qwen-panel');
  const content = document.getElementById('qwen-content');
  
  if (selectedIds.size !== 1) {
    panel.style.display = 'none';
    return;
  }
  
  const segId = [...selectedIds][0];

  if (qwenRecords.length === 0) {
    panel.style.display = 'none';
    return;
  }

      <div style="font-weight:600;color:#60a5fa;font-size:12px">${q.norma || 'Sin norma'}</div>

      <div style="color:#64748b;font-size:10px;margin-top:2px">${q.observaciones}${q.url ? ' <a href="'+q.url+'" target="_blank" style="color:#38bdf8">🔗Ver</a>' : ''}</div>
    </div>
  `).join('');

// ==================== BOX SELECTION ====================
map.on('mousedown',e=>{
  if(currentTool!=='box')return;
  if(e.originalEvent.target.closest('.sidebar')) return;
  
  // Desactivar drag del mapa mientras dibujamos box
  map.dragging.disable();
  boxSelection = L.rectangle(L.latLngBounds(e.latlng,e.latlng),{color:'#38bdf8',weight:1,fillOpacity:0.1});
  boxSelection.addTo(map);
});

map.on('mousemove',e=>{
  if(!boxSelection)return;
  boxSelection.setBounds(L.latLngBounds(boxSelection.getBounds().getNorthWest(),e.latlng));
});

map.on('mouseup',e=>{
  if(!boxSelection)return;
  const bounds = boxSelection.getBounds();
  layerGroup.eachLayer(layer=>{
    if(!layer.segId)return;
    const center = layer.getCenter();
    if(bounds.contains(center)){
      selectedIds.add(layer.segId);
    }
  });
  map.removeLayer(boxSelection);
  boxSelection = null;
  // Reactivar drag del mapa
  map.dragging.enable();
  updateSelectionUI();
  showToast(`${selectedIds.size} segmentos seleccionados`);
});

// ==================== HERRAMIENTA CORTE ====================
let corteMarker = null;

function handleCorte(id,latlng){
  const seg = segments.find(s=>s.id===id);
  if(!seg)return;
  
  if(corteMarker){
    map.removeLayer(corteMarker);
    // Dividir segmento
    const newId = dividirSegmento(seg.id,latlng);
    if(newId){
      showToast('Segmento dividido');
    }
    corteMarker = null;
    return;
  }
  
  // Primer click - marcar punto
  corteMarker = L.circleMarker(latlng,{radius:6,color:'#38bdf8',fillColor:'#38bdf8',fillOpacity:1}).addTo(map);
  showToast('Click en otro segmento para dividir');
}

function dividirSegmento(segId,latlng){
  const seg = segments.find(s=>s.id===segId);
  if(!seg) return null;
  
  const coords = seg.geom.coordinates;
  if(coords.length<2) return null;
  
  // Encontrar punto más cercano
  let minD = Infinity, splitIdx = -1;
  coords.forEach((c,i)=>{
    const d = Math.sqrt((c[0]-latlng.lng)**2 + (c[1]-latlng.lat)**2);
    if(d<minD){minD=d;splitIdx=i;}
  });
  
  if(splitIdx<=0||splitIdx>=coords.length-1) return null;
  
  // Crear dos nuevos segmentos
  const coords1 = coords.slice(0,splitIdx+1);
  const coords2 = coords.slice(splitIdx);
  
  seg.geom.coordinates = coords1;
  seg.props.fid = segId;
  
  const newId = segments.length+1;
  segments.push({
    id: newId,
    name: seg.name,
    props:{...seg.props,fid:newId,estado:'pendiente'},
    geom:{type:'LineString',coordinates:coords2}
  });
  
  rebuildAll();
  return newId;
}

function rebuildAll(){
  window._pointIndex = null;
  buildLayers();
  detectIntersections();
  updateStats();
}

// ==================== DETECTAR INTERSECCIONES ====================
let intersections = [];

function detectIntersections(){
 console.log('Detectando intersecciones...');
 const allLines = segments.map(s=>{
 // Normalizar coordenadas a array de [lon, lat] números
 const rawCoords = s.geom.coordinates;
 let coords;
 if (Array.isArray(rawCoords[0])) {
 // MultiLineString o LineString
 coords = rawCoords[0][0] !== undefined && typeof rawCoords[0][0] === 'number' 
 ? rawCoords // Ya es LineString
 : rawCoords[0]; // Es MultiLineString, tomar primera línea
 } else {
 // Formato inesperado
 coords = [];
 }
 
 return {
 id:s.id,
 coords:coords,
 name:s.name
 };
 }).filter(s => s.coords.length > 0);

 intersections = [];

 for(let i=0;i<allLines.length;i++){
 for(let j=i+1;j<allLines.length;j++){
 const l1 = allLines[i];
 const l2 = allLines[j];

 // Si son la misma calle, no contar
 if(l1.name.toLowerCase()===l2.name.toLowerCase()) continue;

 // Buscar puntos compartidos
 const pts1 = new Set(l1.coords.map(c=>`${Number(c[0]).toFixed(5)},${Number(c[1]).toFixed(5)}`));
 const shared = l2.coords.filter(c=>pts1.has(`${Number(c[0]).toFixed(5)},${Number(c[1]).toFixed(5)}`));

 if(shared.length>0){
 intersections.push({
 seg1: l1.id,
 seg2: l2.id,
 puntos: shared
 });
 }
 }
 }

 console.log(`Encontradas ${intersections.length} intersecciones`);
}

// ==================== ATRIBUTOS ====================
function aplicarAtributos(){
  if(selectedIds.size===0) return;
  
  const tipo = document.getElementById('attr-tipo').value;
  const entre1 = document.getElementById('attr-entre1').value;
  const entre2 = document.getElementById('attr-entre2').value;
  const aprob = document.getElementById('attr-aprob').value;
  const inaugur = document.getElementById('attr-inaug').value;
  const obs = document.getElementById('attr-obs').value;
  
  selectedIds.forEach(id=>{
    const seg = segments.find(s=>s.id===id);
    if(!seg) return;
    
    if(tipo) seg.props.tipo_obra = tipo;
    if(entre1) seg.props.entre_calle_1 = entre1;
    if(entre2) seg.props.entre_calle_2 = entre2;
    if(aprob) seg.props.fecha_aprobacion_concejo = aprob;
    if(inaugur) seg.props.fecha_inauguracion = inaugur;
    if(obs) seg.props.observaciones = obs;
    
    // Auto-marcar como conservado si tiene tipo_obra
    if(tipo && seg.props.estado==='pendiente'){
      seg.props.estado = 'conservado';
      updateLayerColor(id);
    }
  });
  
  updateStats();
  renderList();
  showToast(`Atributos aplicados a ${selectedIds.size} segmento(s)`);
}

function autoDetectarEntreCalles(segId){
  const seg = segments.find(s=>s.id===segId);
  if(!seg || !seg.geom) return {e1:'',e2:''};

  // Obtener coordenadas normalizadas
  const raw = seg.geom.coordinates;
  let coords;
  if (Array.isArray(raw[0])) {
    coords = raw[0][0] !== undefined && typeof raw[0][0] === 'number' ? raw : raw[0];
  } else { coords = []; }
  if (coords.length < 2) return {e1:'',e2:''};

  const startKey = `${Number(coords[0][0]).toFixed(5)},${Number(coords[0][1]).toFixed(5)}`;
  const endKey   = `${Number(coords[coords.length-1][0]).toFixed(5)},${Number(coords[coords.length-1][1]).toFixed(5)}`;

  // Construir índice de calles por punto si no existe
  if (!window._pointIndex) {
    window._pointIndex = {};
    segments.forEach(s => {
      if (!s.geom) return;
      const r = s.geom.coordinates;
      let pts;
      if (Array.isArray(r[0])) {
        pts = r[0][0] !== undefined && typeof r[0][0] === 'number' ? r : r[0];
      } else { pts = []; }
      pts.forEach(c => {
        const k = `${Number(c[0]).toFixed(5)},${Number(c[1]).toFixed(5)}`;
        if (!window._pointIndex[k]) window._pointIndex[k] = {};
        window._pointIndex[k][s.name] = true;
      });
    });
  }

  function getOtherStreets(key, currentName) {
    if (!window._pointIndex[key]) return [];
    return Object.keys(window._pointIndex[key]).filter(n => n.toLowerCase() !== currentName.toLowerCase());
  }

  const e1 = getOtherStreets(startKey, seg.name);
  const e2 = getOtherStreets(endKey, seg.name);

  return {
    e1: e1.length > 0 ? e1[0] : '',
    e2: e2.length > 0 ? e2[0] : ''
  };
}

// ==================== LISTA ====================
function renderList(){
  const q = document.getElementById('search').value.toLowerCase();
  const list = document.getElementById('segment-list');
  list.innerHTML = '';
  
  let filtered = segments.filter(s=>{
    if(currentFilter==='qwen'&&!tieneQwen(s)) return false;
    if(currentFilter!=='all'&&currentFilter!=='qwen'){
      const cat = s.props.estado||'pendiente';
      if(cat!==currentFilter) return false;
    }
    if(q&&!s.name.toLowerCase().includes(q)) return false;
    return true;
  });
  
  filtered.forEach(seg=>{
    const el = document.createElement('div');
    el.className = `segment-item ${seg.props.estado} ${selectedIds.has(seg.id)?'selected':''}`;
    el.dataset.id = seg.id;
    el.onclick = ()=>{
      selectedIds.clear();
      selectedIds.add(seg.id);
      updateSelectionUI();
      
      // Auto-detectar entre calles
      const entre = autoDetectarEntreCalles(seg.id);
      document.getElementById('attr-entre1').value = seg.props.entre_calle_1||entre.e1;
      document.getElementById('attr-entre2').value = seg.props.entre_calle_2||entre.e2;
      document.getElementById('attr-tipo').value = seg.props.tipo_obra||'';
      document.getElementById('attr-aprob').value = seg.props.fecha_aprobacion_concejo||'';
      document.getElementById('attr-inaug').value = seg.props.fecha_inauguracion||'';
      document.getElementById('attr-obs').value = seg.props.observaciones||'';
    };
    
    const estado = seg.props.estado||'pendiente';
    const label = {conservado:'CONSER',descartado:'DESC',pendiente:'PEND'}[estado];
    
    el.innerHTML = `
      <div class="seg-name">${seg.name}${tieneQwen(seg) ? ' <span style="color:#0ea5e9;font-weight:700">◈</span>' : ''}</div>
      <span class="seg-status ${estado}">${label}</span>
    `;
    list.appendChild(el);
  });
}

function setFilter(cat,btn){
  currentFilter = cat;
  document.querySelectorAll('.filter-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

function setTool(tool){

  map.getContainer().style.cursor = tool==='corte'?'crosshair':(tool==='box'?'crosshair':'grab');

// Normalizar geometría para Supabase: LineString → MultiLineString, eliminar crs
function normalizarGeometria(geom, segId){
 if (!geom) {
 console.warn('Segmento sin geometría:', segId);
 return null;
 }

 // Clonar para no mutar el original
 let g;
 try {
 g = JSON.parse(JSON.stringify(geom));
 } catch(e) {
 console.warn('Error clonando geometría del segmento', segId, e);
 return null;
 }

 // PostGIS rechaza la propiedad crs (GeoJSON legacy)
 if (g.crs) delete g.crs;

 if (g.type === 'MultiLineString') return g;

 if (g.type === 'LineString') {
 return {
 type: 'MultiLineString',
 coordinates: [g.coordinates]
 };
 }

 console.warn('Tipo de geometría no soportado para Supabase:', g.type, 'segmento', segId);
 return null;
}

// Sanitizar fechas: convertir a formato YYYY-MM-DD que PostgreSQL acepta
function sanitizarFecha(val){
 if(!val) return null;
 const s = String(val).trim();
 if(s === '' || s === '-') return null;
 // Solo año → 1 de enero
 if(/^\d{4}$/.test(s)) return s + '-01-01';
 // YYYY-MM → 1 del mes
 if(/^\d{4}-\d{2}$/.test(s)) return s + '-01';
 // YYYY-MM-DD → pasar
 if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
 return null; // cualquier otro formato (texto, fechas en español) → null
}

// Calcular longitud de una línea en metros (aproximación)
function calcularLongitud(geom){
 if(!geom || !geom.coordinates) return 0;
 const coords = geom.type === 'LineString' ? geom.coordinates : geom.coordinates[0];
 if(!coords || coords.length < 2) return 0;

 let length = 0;
 for(let i=1; i<coords.length; i++){
 const [lon1, lat1] = coords[i-1];
 const [lon2, lat2] = coords[i];
 length += haversineDistance(lat1, lon1, lat2, lon2);
 }
 return Math.round(length);
}

// Distancia Haversine en metros
function haversineDistance(lat1, lon1, lat2, lon2){
 const R = 6371000; // Radio de la Tierra en metros
 const toRad = x => x * Math.PI / 180;
 const dLat = toRad(lat2 - lat1);
 const dLon = toRad(lon2 - lon1);
 const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
 return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// Importar calles que faltan en Supabase desde un GeoJSON
async function importarCallesFaltantes(event){
  const file = event.target.files[0];
  if(!file) return;
  showToast('Buscando calles faltantes...');
  const reader = new FileReader();
  reader.onload = async function(e){
    try{
      const gj = JSON.parse(e.target.result);
      if(!gj.features || !Array.isArray(gj.features)){
        showToast('Archivo GeoJSON inválido');
        return;
      }

      // Calles que YA tenemos en el editor
      const callesExistentes = new Set(segments.map(s => s.name.toLowerCase().trim()));

      const maxFid = segments.length > 0 ? Math.max(...segments.map(s=>s.id)) : 0;
      let importados = 0, duplicados = 0, nuevasCalles = new Set();

      gj.features.forEach((f, i) => {
        const nombreCalle = (f.properties.name || '').toLowerCase().trim();
        // Si la calle ya existe, omitir
        if (callesExistentes.has(nombreCalle)) { duplicados++; return; }

        // Verificar duplicado por geometría
        const esDuplicado = segments.some(s =>
          s.name.toLowerCase() === nombreCalle &&
          geometriaSimilar(s.geom, f.geometry)
        );
        if(esDuplicado){ duplicados++; return; }

        const newId = maxFid + i + 1 - duplicados;
        segments.push({
          id: newId,
          name: f.properties.name || `Segmento_${newId}`,
          props: {
            fid: newId,
            estado: f.properties.estado || 'pendiente',
            tipo_obra: f.properties.tipo_obra || null,
            entre_calle_1: f.properties.entre_calle_1 || null,
            entre_calle_2: f.properties.entre_calle_2 || null,
            fecha_aprobacion_concejo: f.properties.fecha_aprobacion_concejo || null,
            fecha_inauguracion: f.properties.fecha_inauguracion || null,
            observaciones: f.properties.observaciones || null
          },
          geom: f.geometry
        });
        nuevasCalles.add(f.properties.name);
        importados++;
      });

      rebuildAll();
      const lista = Array.from(nuevasCalles).join(', ');
      showToast(`✅ Importadas ${importados} calles nuevas: ${lista}`);
      console.log(`Calles nuevas importadas: ${lista}`);
      event.target.value = '';
    }catch(err){
      console.error('Error importando calles faltantes:', err);
      showToast('❌ Error: '+err.message);
    }
  };
  reader.readAsText(file);
}

// Comparar si dos geometrías son similares (para detectar duplicados)
function geometriaSimilar(geom1, geom2){
 if(!geom1 || !geom2) return false;
 const coords1 = geom1.type === 'LineString' ? geom1.coordinates : geom1.coordinates[0];
 const coords2 = geom2.type === 'LineString' ? geom2.coordinates : geom2.coordinates[0];
 
 if(!coords1 || !coords2) return false;
 if(coords1.length !== coords2.length) return false;

 // Comparar primer y último punto (dentro de una tolerancia)
 const tol = 0.0001; // ~10 metros
 const prim1 = coords1[0];
 const prim2 = coords2[0];
 const ult1 = coords1[coords1.length-1];
 const ult2 = coords2[coords2.length-1];

 const mismoInicio = Math.abs(prim1[0]-prim2[0]) < tol && Math.abs(prim1[1]-prim2[1]) < tol;
 const mismoFin = Math.abs(ult1[0]-ult2[0]) < tol && Math.abs(ult1[1]-ult2[1]) < tol;

 return mismoInicio && mismoFin;
}

      sinMatch++;
      console.warn(`[Qwen #${idx}] "${q.calle}" → "${mapped}" no tiene segmentos en Supabase`);
      detalle.push({ idx, calle: q.calle, mapped, motivo: 'Sin segmentos', desde: q.desde, hasta: q.hasta });
      return;
    }
    
    const desde = q.desde;
    const hasta = q.hasta;
    if (!desde || !hasta || desde === 'Múltiples tramos') {
      candidatos.forEach(seg => {
        seg.props.tipo_obra = q.tipo_obra || seg.props.tipo_obra;
        seg.props.fecha_aprobacion_concejo = q.fecha_aprobacion || seg.props.fecha_aprobacion_concejo;
        seg.props.fecha_inauguracion = q.fecha_inauguracion || seg.props.fecha_inauguracion;
        seg.props.observaciones = q.norma + (q.observaciones ? ' — ' + q.observaciones : '');
        seg.props.estado = 'conservado';
        aplicados++;
      });
      detalle.push({ idx, calle: q.calle, mapped, desde, hasta, resultado: `Aplicado a ${candidatos.length} segmentos (multitramo)` });
      return;
    }
    
    // 1) Match exacto: un segmento con ambos extremos
    let algunMatch = false;
    const entrecallesReales = [];
    const conDesde = [], conHasta = [];
    candidatos.forEach(seg => {
      const e1 = seg.props.entre_calle_1 || '';
      const e2 = seg.props.entre_calle_2 || '';
      entrecallesReales.push(`[${seg.id}] "${e1}" / "${e2}"`);
      if (matchCalle(e1, desde) || matchCalle(e2, desde)) conDesde.push(seg);
      if (matchCalle(e1, hasta) || matchCalle(e2, hasta)) conHasta.push(seg);
      const matchDirecto = matchCalle(e1, desde) && matchCalle(e2, hasta);
      const matchInverso = matchCalle(e1, hasta) && matchCalle(e2, desde);
      
      if (matchDirecto || matchInverso) {
        aplicarQwenSegmento(seg, q);
        aplicados++;
        algunMatch = true;
      }
    });
    
    // 2) Fallback por rango: si hay segmentos con "desde" y otros con "hasta", aplicar a todos
    if (!algunMatch && conDesde.length > 0 && conHasta.length > 0) {
      candidatos.forEach(seg => {
        aplicarQwenSegmento(seg, q);
        aplicados++;
      });
      algunMatch = true;
      detalle.push({ idx, calle: q.calle, mapped, desde, hasta,
        desdeEn: conDesde.length, hastaEn: conHasta.length,
        resultado: `Fallback rango: aplicado a ${candidatos.length} segmentos` });
    }
    
    // 3) Fallback total: si no hay match, asumir que el tramo Qwen cubre toda la calle
    if (!algunMatch) {
      aplicados += candidatos.length;
      candidatos.forEach(seg => aplicarQwenSegmento(seg, q));
      algunMatch = true;
      detalle.push({ idx, calle: q.calle, mapped, desde, hasta,
        resultado: `Fallback total: aplicado a ${candidatos.length} segmentos (toda la calle)` });
    }

    // Registrar resultado cuando hubo match exacto (step 1)
    if (algunMatch && !detalle.some(d => d.idx === idx)) {
      detalle.push({ idx, calle: q.calle, mapped, desde, hasta, resultado: `${aplicados} parcial` });
    }
  });
  
  console.group('📋 Detalle aplicación QWEN');
  console.table(detalle);
  console.groupEnd();
  
  rebuildAll();
  showToast(`✅ Aplicados: ${aplicados} segmentos | Sin match: ${sinMatch} | Saltados: ${conError}`);
}

// Keyboard handlers
document.addEventListener('keydown',e=>{
  if(e.key==='Shift') isShiftDown = true;
  if(e.key==='Control') isCtrlDown = true;
  if(e.key==='a'&&(e.ctrlKey||e.metaKey)){
    e.preventDefault();
    selectedIds = new Set(segments.map(s=>s.id));
    updateSelectionUI();
  }
  if(e.key==='Delete'||e.key==='Backspace'){
    if(selectedIds.size>0){
      marcarSeleccion('descartado');
    }
  }
});

document.addEventListener('keyup',e=>{
 if(e.key==='Shift') isShiftDown = false;
 if(e.key==='Control') isCtrlDown = false;
});

document.getElementById('import-file')?.addEventListener('change', importarSegmentosNuevos);
document.getElementById('import-faltantes-file')?.addEventListener('change', importarCallesFaltantes);

loadGeoJSON();
setTool('select');
